[package]
name = "org-hierarchy-core"
version = "0.1.0"
edition = "2021"
description = "WASM core for org hierarchy layout"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ts-export = ["dep:ts-rs"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
ts-rs = { version = "10", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
ts-rs = "10"

[profile.release]
opt-level = "s"
lto = true
