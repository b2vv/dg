<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Hierarchy — Demo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <h1>Org Hierarchy SDK</h1>
    <nav class="tabs">
      <button type="button" data-tab="variant-b" class="active">Variant B</button>
      <button type="button" data-tab="staff-tree">Staff tree</button>
      <button type="button" data-tab="flat-orgs">Flat orgs</button>
      <button type="button" data-tab="scale-100k">100k orgs</button>
      <button type="button" data-tab="mapper">Mapper</button>
      <button type="button" data-tab="worker">Worker</button>
    </nav>
    <div class="controls">
      <label class="control">
        Search
        <input id="search-input" type="search" placeholder="Alice… / org-50000" />
      </label>
      <label class="control" id="padding-control" data-contour-only>
        Padding <span id="padding-value" class="control-value">0</span>
        <input id="padding-slider" type="range" min="0" max="2" step="1" value="0" />
      </label>
      <label class="control" id="smooth-control" data-contour-only>
        Smooth <span id="smooth-value" class="control-value">1</span>
        <input id="smooth-slider" type="range" min="0" max="4" step="1" value="1" />
      </label>
      <button type="button" id="theme-toggle" title="Toggle light/dark">Theme</button>
      <button type="button" id="collapse-all">Collapse all</button>
      <div class="export-group" role="group" aria-label="Export">
        <button type="button" id="export-png">PNG</button>
        <button type="button" id="export-svg">SVG</button>
        <button type="button" id="export-pdf">PDF</button>
        <button type="button" id="export-print">Print</button>
      </div>
    </div>
    <span id="status" class="status">Init…</span>
  </header>

  <aside class="sidebar" data-show-tab="mapper">
    <h2>Mapper</h2>
    <button type="button" id="load-sample-json">Load sample JSON</button>
    <label class="file-label">
      Upload JSON
      <input id="json-file" type="file" accept="application/json,.json" />
    </label>
  </aside>

  <aside class="sidebar" data-show-tab="worker">
    <h2>Worker bench</h2>
    <p class="sidebar-note">Runs a pooled map over 5k synthetic rows. Diagram stays on Variant B sample.</p>
    <button type="button" id="run-worker-bench">Run pooled map (5k orgs)</button>
  </aside>

  <main class="stage">
    <div id="diagram-mount" class="diagram-mount"></div>
    <p class="viewport-hint">Pan · pinch / wheel · zoom via +/− · Fit · right-click a card for menu · 100k: search org-N</p>
  </main>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
