name: AI review

# Two independent reviewers on every PR. They run as separate jobs on separate
# runners, so neither sees the other's findings — and neither saw how the code
# was written. That blindness is the point: the reviewer reads the task, the
# diff and the yardstick from scratch, the way a new colleague would.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standards:
    name: Pass 1 — standards
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if`, so it is mapped to env
    # here and checked per step. Without the key the job reports what is
    # missing instead of failing the PR.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: No API key — say so and stop
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice title=AI review skipped::ANTHROPIC_API_KEY is not set in repo secrets."
          echo "Add it with: gh secret set ANTHROPIC_API_KEY"
          echo "Until then this workflow reports skipped rather than passing silently."

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against THIS repo's documented yardstick.
            The PR branch is already checked out.

            YARDSTICK — read `.claude/standards.md` first and treat it as the
            list of what counts. Do not guess at standards, and do not invent
            rules that are not written down.

            Binding rules from that manifest:
            - `## Мірник` says which doc governs what, and the "діє на" column
              says on WHICH PATHS. Honour it. `work/CODING_STANDARDS.md` is
              TypeScript only (`packages/sdk`, `packages/demo`) — a Matt Pocock
              finding on a `.rs` file is wrong by construction.
            - `packages/core` (Rust) has NO documented standard and no clippy
              gate. Judge it on general engineering practice and say that is
              what you are doing.
            - `## Не мірник` lists what must NOT be used as a measure —
              `work/tasks/**`, `work/tech-debt/**`, `docs/REQUIREMENTS.md`,
              `archive/**`. Recorded debt is not a violation.
            - This repo has NO linter and NO formatter, so the usual "skip what
              tooling already enforces" does not apply: naming, function size,
              argument count, `any`, `satisfies` vs `as` are all yours to check.
            - `## Конституція` violations are blocking, not remarks.

            For each finding give: `file:line`, WHICH document and rule it
            breaks, the failure class (not just the symptom), and whether it is
            a hard violation or a judgement call. A finding you cannot tie to a
            written rule is a judgement call — label it as one.

            Do not demand a design pattern for its own sake. "Strategy belongs
            here" is not a finding; "these two places decide the same thing
            differently" is.

            Use `gh pr comment` for the summary. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific lines. Post GitHub comments only.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  spec-and-edges:
    name: Pass 2 — spec, edges, safety
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No API key — say so and stop
        if: env.HAS_KEY != 'true'
        run: echo "::notice title=AI review skipped::ANTHROPIC_API_KEY is not set in repo secrets."

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            A second, independent review. You have NOT seen the standards pass
            and must not try to reproduce it — style and naming are not yours.
            Yours is: does this do what was asked, and what happens at the edges.

            1. SPEC AXIS. Find what this PR was supposed to do — issue refs in
               the commits (`gh pr view`, `gh issue view`), a plan under
               `work/reports/<topic>/`, or a task in `work/tasks/`. Then report
               what is MISSING versus that intent, what was done BEYOND it, and
               what was done DIFFERENTLY. If no spec exists, say so plainly —
               do not reconstruct one from the diff, because a spec derived
               from the code can never disagree with the code.

            2. EDGES. For the changed behaviour only, ask: empty / single /
               maximum / duplicate input; a dependency failing or answering
               slowly; the same action arriving twice or concurrently; partial
               application halfway through. Report the ones the diff does not
               handle, with the input that breaks it.

            3. BOUNDARIES. This repo's risky seams are the WASM ↔ TS border,
               `main` ↔ worker messaging, and the public SDK API described in
               `docs/USAGE.md`. If the diff moves any of them, say what crosses
               the boundary now, who owns the memory, and whether `docs/USAGE.md`
               changed with the signature.

            Then set exactly one triage label via `gh pr edit`:
            - `ready-for-human` — you found nothing blocking;
            - `needs-info` — you could not tell whether it is correct, and name
              what information would settle it.

            Use `gh pr comment` for the summary. Post GitHub comments only.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr edit:*),Read,Grep,Glob"
