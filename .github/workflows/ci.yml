name: CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test
        run: cargo test

  sdk:
    name: SDK + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Typecheck (SDK + emit types + demo)
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke
        run: npm run test:e2e

      # The renderer rows have a branch that only exists where the browser
      # refuses a WebGL context it would have to emulate — the state of a
      # terminal without a GPU. A normal runner grants that context, so without
      # this second pass the branch that matters for T83 is never executed.
      - name: E2E on an emulated GPU (renderer choice)
        env:
          SOFTWARE_GL: '1'
        run: npx playwright test e2e/renderer-choice.spec.ts

      # Visual baselines cannot be produced anywhere but here: a local container
      # renders identically to itself and differently from this runner (fonts,
      # and native amd64 vs emulated). On failure the runner's own `-actual.png`
      # files are the only correct source for new baselines, so they have to
      # leave the machine.
      - name: Upload what the runner actually drew
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-actual
          path: test-results/
          retention-days: 7
